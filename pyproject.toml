[build-system]
# PEP 639 `license`/`license-files` below need hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uripath"
version = "0.10.0"
authors = [{ name = "Jose A" }]
description = "pathlib-style paths for URIs: file:, data:, ftp:, zip:, tar:, http:, dav:, github:, gitlab: and git:"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: SPDX license expression plus the file it refers to. This replaces
# the legacy `License ::` classifier; do not list one alongside it.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    # src/uripath/py.typed ships in the wheel.
    "Typing :: Typed",
]
dependencies = [
    "pathlib-next>=0.10.0,<0.11",
    # 0.3.3 and 0.3.4 break asyncssh's SFTP server on Windows; 0.4.0 does not.
    "netimps>=0.4.0,<0.5",
]

[project.scripts]
uripath = "uripath.cli:main"

[project.optional-dependencies]
# The command line. 0.7.3 added duho.running_mode(), which the commands use.
cli = ['duho>=0.7.3,<0.8']
dev = [
    'uripath[cli]',
    # The oracle of the property tests, not a run-time dependency: parsing and
    # composing are the standard library's. uritools 6 needs Python 3.10; 5.0 is
    # the newest release for 3.9.
    'uritools>=5.0,<7',
    'build',
    'twine',
    'hatchling',
    'pytest',
    'pytest-cov',
    'pyftpdlib',
    'wsgidav',
    'cheroot',
    'cryptography',
    'hypothesis',
    'black',
]
docs = ['mkdocs', 'mkdocs-material', 'mkdocstrings[python]']

[project.entry-points."uripath.schemes"]
file = "uripath.schemes:FileURIPath"
data = "uripath.schemes:DataURIPath"
zip = "uripath.schemes:ZipURIPath"
tar = "uripath.schemes:TarURIPath"
archive = "uripath.schemes:ArchiveURIPath"
"archive+zip" = "uripath.schemes:ArchiveZipURIPath"
"archive+tar" = "uripath.schemes:ArchiveTarURIPath"
ftp = "uripath.schemes:FTPURIPath"
ftps = "uripath.schemes:FTPURIPath"
http = "uripath.schemes:HTTPURIPath"
https = "uripath.schemes:HTTPURIPath"
dav = "uripath.schemes:DAVURIPath"
davs = "uripath.schemes:DAVURIPath"
github = "uripath.schemes:GitHubURIPath"
gitlab = "uripath.schemes:GitLabURIPath"
git = "uripath.schemes:GitURIPath"
"git+github" = "uripath.schemes:GitHubGitURIPath"
"git+gitlab" = "uripath.schemes:GitLabGitURIPath"

[project.urls]
Homepage = "https://github.com/jose-pr/uripath/"
Documentation = "https://jose-pr.github.io/uripath/"
Issues = "https://github.com/jose-pr/uripath/issues"

# Ship the consumer-facing docs inside the installed package, so they are
# readable from site-packages via importlib.resources without the repo.
# src/uripath/AGENTS.md (the API header) is included automatically by living
# in the package dir. The repo-root AGENTS.md is contributor orientation for a
# checkout and is not part of the wheel.
[tool.hatch.build.targets.wheel.force-include]
"README.md" = "uripath/README.md"

# `*.local.*` files are per-machine overrides and `CLAUDE*` is agent config:
# neither is ever packaged (both are also gitignored). `/.*` does not match
# them, since their names do not start with a dot.
[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/uripath"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
# Pinned to the project's *minimum* supported Python so black never emits
# syntax the 3.9 floor cannot parse.
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
