site_name: uripath
site_description: pathlib-style paths for URIs
site_url: https://jose-pr.github.io/uripath/
repo_url: https://github.com/jose-pr/uripath
repo_name: jose-pr/uripath
edit_uri: edit/main/docs/

# Constrain the scan to docs/ so pymdownx.snippets + strict nav don't trip on
# repo-level markdown.
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Guides:
      - Schemes: guides/schemes.md
      - CLI: guides/cli.md
      - Extending: guides/extending.md
  - Benchmarks: benchmarks.md
  - Divergences from pathlib: divergences.md
  - API Reference:
      - URI: api/uri.md
      - Exceptions: api/exceptions.md
      - Schemes:
          - "file: and data:": api/schemes/local.md
          - "http: and dav:": api/schemes/http.md
          - "ftp:": api/schemes/ftp.md
          - Archives: api/schemes/archive.md
      - CLI: api/cli.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
