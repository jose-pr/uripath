name: Docs

# Builds the docs site and deploys it to GitHub Pages. Kept separate from
# release.yml (three workflow files: test, release, docs) so the docs site can
# be rebuilt/redeployed without cutting a release, and a release is not the
# first time the docs build is exercised. This workflow owns ALL Pages deploys
# (main = latest, a release = the version just shipped); release.yml only gates
# on a strict docs build, then dispatches this one at its tag.
#
# Triggers:
#   - push to the default branch touching docs sources (keeps Pages current);
#     CHANGELOG.md counts when the docs embed it.
#   - workflow_dispatch, for a manual redeploy of any ref, and the one a release
#     uses. (A release made with GITHUB_TOKEN fires no `release` event for other
#     workflows, which is why this does not listen for one.)
#
# It self-enables Pages on every run (configure-pages with enablement). Two repo
# settings a workflow cannot set for itself: default workflow permissions must
# be read and write (Settings -> Actions -> General), or `pages: write` cannot be
# granted; and the `github-pages` environment's deployment policy must allow
# `v*` tags, or a release's deploy is rejected after a successful build.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      pathlib_next_ref:
        description: "Git ref of jose-pr/pathlib-next to install instead of the release (branch, tag, or SHA); empty uses the repository variable PATHLIB_NEXT_REF"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The pathlib-next to install first: a git ref of jose-pr/pathlib-next from the
  # dispatch input, else from the repository variable PATHLIB_NEXT_REF (a push
  # has no input). With both empty, pip takes it from PyPI. The API pages import
  # the package, so the build needs it.
  CORE_REF: ${{ inputs.pathlib_next_ref || vars.PATHLIB_NEXT_REF }}

# Serialize deploys; never cancel an in-flight Pages deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-build:
    name: Build documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write   # configure-pages' enablement turns Pages on when it is off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Build docs
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  docs-deploy:
    name: Deploy documentation to GitHub Pages
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
