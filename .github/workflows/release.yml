name: Release

# Runs when a version tag (e.g. v1.0.0, v1.0.0-rc.1) is pushed. Not wired to
# push/PR events on branches -- this is a release gate, not general CI.
#
# Test gate and dependency-floor gate, build (checking that the tag names the
# version built), an installed-wheel smoke test with and without the `cli`
# extra, a strict docs build gate, the GitHub Release, then -- for final (non
# pre-release) tags only -- the PyPI upload and a dispatch of docs.yml at this
# tag. The docs site is only GATED here (docs-gate never deploys); docs.yml owns
# every Pages deploy.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # A git ref of jose-pr/pathlib-next to install first (the repository variable
  # PATHLIB_NEXT_REF), for a pre-release made while the pathlib-next that
  # pyproject.toml asks for is not on PyPI yet. Empty installs it from PyPI. A
  # final tag refuses a ref: what is released is what users install.
  CORE_REF: ${{ vars.PATHLIB_NEXT_REF }}

jobs:
  released-core:
    name: Source of pathlib-next
    runs-on: ubuntu-latest
    steps:
      - name: Say where pathlib-next comes from
        run: echo "pathlib-next from ${CORE_REF:-PyPI}"
      - name: Refuse a git ref of pathlib-next on a final tag
        if: ${{ env.CORE_REF != '' && !contains(github.ref_name, '-') }}
        run: |
          echo "PATHLIB_NEXT_REF is set: a final release is tested against the pathlib-next on PyPI. Release pathlib-next first and delete the repository variable." >&2
          exit 1

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install package with its test servers
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The same job test.yml runs: a release must hold at the lowest version of every
  # dependency the manifest claims to support.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The two typing checks of tests/test_public_surface.py (mypy and pyright on
  # a consumer script) skip unless a checker is importable, and no other job
  # installs one: they run here. The step fails if either was skipped.
  typing:
    name: Typing checks (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install the package, pytest and the two checkers
        # basedpyright, not the PyPI `pyright`: that one downloads node at
        # run time. The test accepts either.
        run: python -m pip install -e . pytest mypy basedpyright
      - name: Run the typing checks
        run: |
          python -m pytest -q -rs tests/test_public_surface.py -k "mypy_accepts or pyright_accepts" | tee typing.log
          grep -q "2 passed" typing.log

  build:
    name: Build distribution
    needs: [released-core, test, floors, typing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          want = Version(tag[1:] if tag.startswith("v") else tag)
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel, not the checkout: install it into two
  # clean environments, one as `pip install uripath` and one with the `cli`
  # extra, and check that each imports, carries the files it must ship and
  # behaves as that install should.
  wheel-smoke:
    name: Installed-wheel smoke test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a fresh venv, and into one with the cli extra
        run: |
          wheel="$(ls dist/*.whl)"
          python -m venv "$RUNNER_TEMP/bare"
          python -m venv "$RUNNER_TEMP/cli"
          for venv in bare cli; do
            if [ -n "$CORE_REF" ]; then
              "$RUNNER_TEMP/$venv/bin/pip" install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
            fi
          done
          "$RUNNER_TEMP/bare/bin/pip" install "$wheel"
          "$RUNNER_TEMP/cli/bin/pip" install "$wheel[cli]"
      - name: Import it, and find the files it must ship
        working-directory: ${{ runner.temp }}
        run: |
          cat > check.py <<'PY'
          from importlib.metadata import entry_points
          from importlib.resources import files
          import sys

          import uripath

          root = files("uripath")
          for name in ("py.typed", "AGENTS.md", "README.md"):
              assert (root / name).is_file(), "the wheel does not ship %s" % name
          found = entry_points()
          if hasattr(found, "select"):
              schemes = list(found.select(group="uripath.schemes"))
          else:
              schemes = list(found.get("uripath.schemes", []))
          names = {ep.name for ep in schemes}  # a repeated sys.path entry repeats a distribution
          assert len(names) == 18, "expected 18 scheme entry points, found %s" % sorted(names)
          loaded = {"duho", "uritools", "requests", "paramiko", "asyncssh", "boto3"} & set(sys.modules)
          assert not loaded, "importing uripath loaded %s" % sorted(loaded)
          print("ok:", uripath.__name__, uripath.__version__, len(names), "schemes")
          PY
          for venv in bare cli; do
            "$RUNNER_TEMP/$venv/bin/python" check.py
          done
      - name: Without the extra the command names it
        working-directory: ${{ runner.temp }}
        run: |
          printf 'hello\n' > local.txt
          status=0
          "$RUNNER_TEMP/bare/bin/uripath" read local.txt 2> stderr.txt || status=$?
          cat stderr.txt
          test "$status" = 1
          grep -q 'uripath\[cli\]' stderr.txt
      - name: With the extra the console script and python -m uripath read a local file
        working-directory: ${{ runner.temp }}
        run: |
          printf 'hello\n' > local.txt
          test "$("$RUNNER_TEMP/cli/bin/uripath" read local.txt)" = "hello"
          test "$("$RUNNER_TEMP/cli/bin/python" -m uripath read local.txt)" = "hello"
          "$RUNNER_TEMP/cli/bin/uripath" --version

  # Docs are DEPLOYED by docs.yml. This job only GATES the release on a strict
  # docs BUILD: a release must never ship if the docs site is broken, but the
  # release path never deploys Pages itself -- the docs-deploy job at the end
  # dispatches docs.yml for this tag, off the publish chain.
  docs-gate:
    name: Docs build gate (strict, no deploy)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pathlib-next from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install package with docs tooling
        run: python -m pip install -e ".[dev,docs]"
      - name: Build docs (gate only)
        run: mkdocs build --strict

  github-release:
    name: Create GitHub Release
    needs: [build, docs-gate, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag  # v1.0.0-rc.1 -> 1.0.0-rc.1

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop before the next "## [version]" heading, or before the
          # trailing "[version]: https://..." reference-link block at the
          # end of the file (only relevant when this tag is the oldest
          # tracked release, so there's no next heading to stop at).
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # Pin the release object to the tagged commit; left unset it defaults
          # to the default branch.
          target_commitish: ${{ github.sha }}
          # A repo that pushes commits directly (no PR flow) gets a thin/empty
          # auto-generated "What's Changed" on every release, not just the
          # first -- the scraped CHANGELOG.md section is the real notes.
          # generate_release_notes still runs and appends its own
          # "Full Changelog: <compare link>" line after body_path's content.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md

  # After the GitHub release, and only for a final tag: a PyPI upload is
  # irreversible (a version can never be reused), a GitHub release is not.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uripath/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A partially-completed release re-run must not hard-fail on files
          # already uploaded (PyPI never lets a version be replaced); skip them
          # and publish only what's missing. The build job's tag/version check
          # keeps it from masking a wrong tag.
          skip-existing: true

  # Events made with the workflow's own GITHUB_TOKEN, such as the release above,
  # start no workflows, so docs.yml cannot listen for the release itself. A
  # workflow_dispatch is the exception: it deploys the docs at this tag. A
  # pre-release leaves the published docs alone. Off the publish chain, so a
  # docs problem never blocks a package that passed its tests.
  docs-deploy:
    name: Deploy the docs for this release
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docs.yml at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
