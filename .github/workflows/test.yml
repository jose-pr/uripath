name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Not triggered by push/PR on branches by default -- add that only if the
# project actually wants CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      pathlib_next_ref:
        description: "Git ref of jose-pr/pathlib-next to install instead of the release (branch, tag, or SHA)"
        required: false
        default: ""
      benchmark:
        description: "Also run the benchmark suite (manual runs only)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from a git ref
        if: ${{ inputs.pathlib_next_ref != '' }}
        # The core is installed first, so the step below finds the range
        # satisfied and leaves it alone; an empty input installs the release.
        env:
          CORE_REF: ${{ inputs.pathlib_next_ref }}
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install package with its test servers
        # `dev` holds every test server; a missing one skips its tests
        # (pytest.importorskip) instead of running them.
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # -rs lists every skip with its reason, so a missing extra shows up.
        run: python -m pytest -q -rs

  # The declared floors, exercised: every runtime dependency and feature extra
  # installed AT the lower bound pyproject.toml declares (`>=X.Y.0` -> `==X.Y.0`),
  # on the oldest supported Python. The matrix above only
  # ever gets the newest releases, so a floor that no longer works would
  # otherwise go unnoticed.
  floors:
    name: Test at the declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Pin every declared dependency to its floor
        shell: python
        run: |
          import re
          import subprocess
          import sys

          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "tomli"], check=True)
          import tomli

          project = tomli.load(open("pyproject.toml", "rb"))["project"]
          specs = list(project.get("dependencies", []))
          for extra, deps in project.get("optional-dependencies", {}).items():
              if extra not in ("dev", "docs"):
                  specs += deps
          pins = []
          for spec in specs:
              m = re.match(r"^\s*([A-Za-z0-9._-]+)(\[[^\]]*\])?\s*[^;]*?>=\s*([^,;\s]+)", spec)
              if m:
                  pins.append("%s==%s" % (m.group(1), m.group(3)))
          open("floors.txt", "w").write("\n".join(pins) + "\n")
          print("\n".join(pins) or "(no floors declared)")
      - name: Install pathlib-next from a git ref
        if: ${{ inputs.pathlib_next_ref != '' }}
        # An empty input installs the release at its floor.
        env:
          CORE_REF: ${{ inputs.pathlib_next_ref }}
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install at the floors
        run: python -m pip install -c floors.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  # The two typing checks of tests/test_public_surface.py (mypy and pyright on
  # a consumer script) skip unless a checker is importable, and no other job
  # installs one: they run here. The step fails if either was skipped.
  typing:
    name: Typing checks (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathlib-next from a git ref
        if: ${{ inputs.pathlib_next_ref != '' }}
        # The core is installed first, so the step below finds the range
        # satisfied and leaves it alone; an empty input installs the release.
        env:
          CORE_REF: ${{ inputs.pathlib_next_ref }}
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install the package, pytest and the two checkers
        # basedpyright, not the PyPI `pyright`: that one downloads node at
        # run time. The test accepts either.
        run: python -m pip install -e . pytest mypy basedpyright
      - name: Run the typing checks
        run: |
          python -m pytest -q -rs tests/test_public_surface.py -k "mypy_accepts or pyright_accepts" | tee typing.log
          grep -q "2 passed" typing.log

  benchmark:
    name: Benchmarks (py3.14, ${{ matrix.os }})
    # Opt-in: benchmarks are noisy and slow, so they never run on ci-* tags
    # or by default; dispatch the workflow with benchmark=true.
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pathlib-next from a git ref
        if: ${{ inputs.pathlib_next_ref != '' }}
        # The core is installed first, so the step below finds the range
        # satisfied and leaves it alone; an empty input installs the release.
        env:
          CORE_REF: ${{ inputs.pathlib_next_ref }}
        run: python -m pip install "pathlib-next @ git+https://github.com/jose-pr/pathlib-next@${CORE_REF}"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run benchmark suite
        shell: pwsh
        run: |
          python benchmarks/bench.py --save --name "ci-${{ matrix.os }}-py3.14" | Tee-Object -FilePath benchmark.txt
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.txt
            benchmarks/results/*.json
